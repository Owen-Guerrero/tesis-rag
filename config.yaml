# =============================================================
# Configuración central del EXPERIMENTO (igual en todas las máquinas)
# Regla: ningún parámetro se escribe dentro del código.
# El hardware NO va aquí: va en maquinas/<nombre>.yaml
# =============================================================

llm:
  modelo: "llama3.1:8b"   # PROVISIONAL. Se fija tras la selección del OE2.
  temperatura: 0.0        # 0 = respuestas deterministas
  top_p: 1.0
  semilla: 42
  num_ctx: 8192           # Jovanovski et al. (2026): mejores resultados con 8192
  max_tokens: 512
  razonamiento: null      # modelos con "thinking": false o "low"; null = no se envía

# OE2: modelos candidatos de pesos abiertos (se comparan con las dos familias de métricas).
# Tres de ellos fueron evaluados por Jovanovski et al. (2026).
# En la PC personal (12 GB) solo entran los dos primeros.
candidatos_llm:
  - "llama3.1:8b"
  - "qwen2.5:14b"
  - "gpt-oss:20b"
  - "qwen2.5:32b"

verificacion:
  repeticiones: 3         # Jovanovski et al. (2026) repiten cada medición 3 veces

# OE1/OE5/OE6: fragmentación en "hojas" (las MISMAS para naive RAG y RAPTOR).
# Sarthi et al. (2024): fragmentos de 100 tokens sin cortar oraciones,
# contados con el tokenizador cl100k_base (tiktoken), como en el código oficial de RAPTOR.
fragmentacion:
  max_tokens: 100
  tokenizador: "cl100k_base"
  encabezado: true        # cada hoja lleva "norma + id + título" para no perder el contexto

# OE4: modelo de embeddings (servido por Ollama, igual que el LLM).
# Debe ser MULTILINGÜE: las preguntas están en español y el corpus en inglés.
embeddings:
  modelo: "qwen3-embedding:0.6b"   # Seleccionado en el OE4 (MRR 1,00; 5 preguntas reservadas, lab_p5)
  lote: 64                	   # hojas por llamada a Ollama

# Candidatos del OE4 y el prefijo que cada uno exige según su ficha técnica.
# Si un modelo pide un prefijo y no se le pone, recupera peor.
candidatos_embeddings:
  "bge-m3":
    prefijo_consulta: ""
    prefijo_documento: ""
  "qwen3-embedding:0.6b":
    prefijo_consulta: "Instruct: Given a question about a cybersecurity standard, retrieve the normative passages that answer the question\nQuery:"
    prefijo_documento: ""
  "embeddinggemma":
    prefijo_consulta: "task: search result | query: "
    prefijo_documento: "title: none | text: "
  "snowflake-arctic-embed2":
    prefijo_consulta: "query: "
    prefijo_documento: ""

# OE5/OE6: recuperación con el MISMO presupuesto de contexto para ambas arquitecturas.
# Sarthi et al. (2024), árbol colapsado: se agregan nodos en orden de similitud
# hasta el máximo de tokens. Naive RAG usa la misma regla sobre las hojas.
recuperacion:
  presupuesto_tokens: 2000
  candidatos: 100         # nodos que se piden a ChromaDB antes de aplicar el presupuesto

# Base vectorial local (NO se sube a GitHub: guarda texto ISO)
almacen:
  ruta: "chroma_db"
